<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../assets/Group 2 (1).png">
    <title>Add User | KIORA</title>
</head>

<body class="min-h-screen bg-gray-200 font-sans antialiased">
    <!-- Top Navigation -->
    <header class="w-full bg-slate-900">
        <nav class="flex items-center justify-end gap-3 px-4 py-4 sm:px-6 sm:py-5 md:gap-4 md:px-8">
            <button type="button"
                class="rounded-full bg-yellow-400 px-5 py-2 text-sm font-semibold text-black transition hover:bg-yellow-300 sm:px-6 sm:py-2.5 sm:text-base">
                Category
            </button>
            <button type="button"
                class="rounded-full bg-yellow-400 px-5 py-2 text-sm font-semibold text-black transition hover:bg-yellow-300 sm:px-6 sm:py-2.5 sm:text-base">
                Product
            </button>
            <button type="button"
                class="rounded-full bg-yellow-400 px-5 py-2 text-sm font-semibold text-black transition hover:bg-yellow-300 sm:px-6 sm:py-2.5 sm:text-base">
                Add User
            </button>
            <button type="button"
                class="rounded-2xl bg-red-300 px-5 py-2 text-sm font-semibold text-black transition hover:bg-yellow-300 sm:px-6 sm:py-2.5 sm:text-base">
                Logout
            </button>
        </nav>
    </header>

    <!-- add Category -->
    <div class="mx-8 mt-6 flex items-center justify-between">
        <h1 class="text-4xl font-bold">
            Kiora Staff Registration
        </h1>
    </div>

    <!-- Main Content -->
    <div class="mx-8 py-8">
        <div class="bg-white rounded-3xl shadow-lg p-6">

            <form class="space-y-5">

                <div>
                    <label class="font-semibold block mb-2">
                        Email
                    </label>

                    <input type="email" class="input input-bordered w-full" placeholder="Enter email">
                </div>

                <div>
                    <label class="font-semibold block mb-2">
                        Username
                    </label>

                    <input type="text" class="input input-bordered w-full" placeholder="Enter username">
                </div>

                <div>
                    <label class="font-semibold block mb-2">
                        Phone Number
                    </label>

                    <input type="text" class="input input-bordered w-full" placeholder="Enter phone number">
                </div>

                <div>
                    <label class="font-semibold block mb-2">
                        Address
                    </label>

                    <textarea class="textarea textarea-bordered w-full" placeholder="Enter address"></textarea>
                </div>

                <div>
                    <label class="font-semibold block mb-2">
                        Password
                    </label>

                    <input type="password" class="input input-bordered w-full" placeholder="Enter password">
                </div>

                <div class="flex gap-3 mt-8">
                    <button type="submit" class="btn btn-info">
                        Save
                    </button>

                    <a href="/" class="btn btn-outline">
                        Cancel
                    </a>
                </div>

            </form>

        </div>
    </div>
</body>

</html>
