<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <link href="https://cdn.jsdelivr.net/npm/daisyui@5" rel="stylesheet" type="text/css" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
    <link rel="icon" type="image/x-icon" href="../assets/Group 2 (1).png">
    <title>Product Management| KIORA</title>
</head>

<body class="min-h-screen bg-gray-200 font-sans antialiased">
    <!-- Top Navigation -->
    <header class="w-full bg-slate-900">
        <nav class="flex items-center justify-end gap-3 px-4 py-4 sm:px-6 sm:py-5 md:gap-4 md:px-8">
            <button type="button"
                class="rounded-full bg-yellow-400 px-5 py-2 text-sm font-semibold text-black transition hover:bg-yellow-300 sm:px-6 sm:py-2.5 sm:text-base">
                Category
            </button>
            <button type="button"
                class="rounded-full bg-yellow-400 px-5 py-2 text-sm font-semibold text-black transition hover:bg-yellow-300 sm:px-6 sm:py-2.5 sm:text-base">
                Product
            </button>
            <button type="button"
                class="rounded-full bg-yellow-400 px-5 py-2 text-sm font-semibold text-black transition hover:bg-yellow-300 sm:px-6 sm:py-2.5 sm:text-base">
                Add User
            </button>
            <button type="button"
                class="rounded-2xl bg-red-300 px-5 py-2 text-sm font-semibold text-black transition hover:bg-yellow-300 sm:px-6 sm:py-2.5 sm:text-base">
                Logout
            </button>
        </nav>
    </header>

    <!-- add Category -->
    <div class="mx-8 mt-6 flex items-center justify-between">
        <h1 class="text-4xl font-bold">
            Kiora Category Management
        </h1>

        <button type="button"
            class="rounded-2xl bg-yellow-400 px-6 py-3 text-lg font-semibold text-black transition hover:bg-yellow-300">
            + Add Product
        </button>
    </div>
    <!-- Main Content -->
    <div class="mx-8 py-10">
        <div class="bg-white rounded-3xl shadow-lg p-6">

            <div class="overflow-x-auto">
                <table class="table w-full">
                    <thead>
                        <tr class="border-b-2 border-black">
                            <th>No.</th>
                            <th>Picture</th>
                            <th>Description</th>
                            <th>Stock</th>
                            <th>Action</th>
                        </tr>
                    </thead>

                    <tbody>
                        <tr class="border-b">
                            <th>1</th>

                            <td>
                                <div class="avatar">
                                    <div class="w-70 h-50 rounded-xl">
                                        <img src="https://www.ikea.com/global/en/media/PH_209816_bf1623e9fb.jpg" />
                                    </div>
                                </div>
                            </td>

                            <td>Zemlak, Daniel and Leannon</td>

                            <td>50</td>

                            <td class="space-x-2">
                                <button class="btn btn-sm btn-warning">
                                    Edit
                                </button>

                                <button class="btn btn-sm btn-error text-white">
                                    Delete
                                </button>
                            </td>
                        </tr>

                    </tbody>
                </table>
            </div>

        </div>
    </div>
</body>

</html>
